[build-system]
requires = ["setuptools>=77", "grpcio-tools==1.81.1"]
build-backend = "setuptools.build_meta"

[project]
name = "premixdb"
version = "0.1.2"
description = "Data mixtures for LLM pretraining that you can reproduce and trace"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "protobuf>=6.33.5,<7",
    "blake3>=1.0.10",
    "packaging>=24",
    "ipython>=9.17.1,<10",
    "tokenizers>=0.23.1,<0.24",
    # Stats and language detection use these parts of DataTrove. Its full
    # processing extra also installs NLTK, which has an unpatched advisory.
    "datatrove==0.3.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "datatrove==0.10.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "fasteners>=0.19",
    "fasttext-wheel==0.9.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "fasttext-numpy2-wheel>=0.9.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "regex>=2025.10.22",
    "tldextract>=5.3,<6",
    "spacy>=3.8,<4",
    "fsspec[http]>=2023.12.0",
    "marin-dupekit==0.1.1",
    "pyarrow>=18,<24",
    "pyroaring>=1.2,<2",
    "transformers>=5.10,<6",
    "sentence-transformers>=5.7,<6",
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.5,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "einops>=0.8,<1",
    "datasets>=5.0.1,<6",
]

[project.optional-dependencies]
huggingface = []  # Compatibility spelling; Hub capture is included in the base install.

[project.scripts]
premixdb = "premixdb.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["premixdb", "premixdb.*"]

[tool.setuptools.package-data]
premixdb = ["py.typed", "*.pyi", "engine/*.pyi", "data/*.txt", "data/*.json", "data/*.md"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.cmdclass]
build = "_premixdb_build.Build"
build_py = "_premixdb_build.BuildPy"
build_protos = "_premixdb_build.BuildProtos"

[tool.uv]
required-version = ">=0.12.20"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/_premixdb_build.py" },
    { file = "proto/**/*.proto" },
    { file = "src/premixdb/**/*.pyi" },
    { file = "src/premixdb/py.typed" },
    { file = "src/premixdb/**/*.py" },
    { file = "src/premixdb/data/*.txt" },
    { file = "src/premixdb/data/*.json" },
    { file = "src/premixdb/data/*.md" },
]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["pyproject.toml", "src/**/*.py", "src/**/*.pyi", "tests/**/*.py", "scripts/**/*.py", "examples/**/*.py"]
extend-exclude = ["src/premixdb/v1/*_pb2.py", "src/premixdb/v1/*_pb2.pyi", "src/premixdb/v1/*_pb2_grpc.py", "src/premixdb/internal/*_pb2.py", "src/premixdb/internal/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-select = [
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206", "ANN401",
    "B006", "B012", "B018", "B019", "B020", "B024", "B025", "B026",
    "B029", "B033", "B034", "B035", "RUF017", "RUF100", "PGH003", "TID251",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use concrete types, bounded generics or protocols; validate external data at its boundary."

[tool.ty.environment]
python-version = "3.12"
root = ["src"]
extra-paths = ["examples", "tests"]

[tool.ty.src]
include = ["src/premixdb", "src/_premixdb_build.py", "scripts", "examples", "tests"]
exclude = ["src/premixdb/v1", "src/premixdb/internal"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
dynamic-function-decorator-return = "error"
blanket-ignore-comment = "error"

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["tests", "examples"]
addopts = "-ra --strict-markers --strict-config --benchmark-disable -n auto --maxprocesses=6 --dist=loadfile --no-loadscope-reorder -m 'not integration and not performance'"
timeout = 180
markers = [
    "integration: package builds, example workflows, and real subprocess/worker checks",
    "performance: repeatable performance measurements (enable with --benchmark-enable)",
]

[tool.coverage.run]
branch = true
source = ["premixdb"]
patch = ["subprocess"]
omit = ["*/premixdb/v1/*_pb2*.py", "*/premixdb/internal/*_pb2*.py"]

[tool.coverage.paths]
source = ["src/premixdb", "*/src/premixdb", "*/installed/premixdb", "*/build/lib/premixdb"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
precision = 2

[tool.coverage.xml]
output = "reports/coverage.xml"

[dependency-groups]
dev = [
    "grpcio-tools==1.81.1",
    "hypothesis>=6.140,<7",
    "pip-audit>=2.9,<3",
    "pytest>=8.4,<10",
    "pytest-benchmark>=5.1,<6",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.16.9",
    "setuptools>=77",
    "twine>=6.2,<7",
    "ty>=0.0.84",
]
